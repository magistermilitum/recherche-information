<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>Un résultat documentaire construit à partir d’une page réelle d’Atmo Hauts-de-France</title><rect width="1440" height="960" fill="#fbfcfd"/><g font-family="Arial,Helvetica,sans-serif"><rect x="44" y="38" width="1352" height="94" rx="16" fill="white" stroke="#b9c7ce" stroke-width="2"/><text x="80" y="98" font-size="44" fill="#17212b" font-weight="400">qualité air Lille amélioration</text><text x="60" y="193" font-size="23" fill="#667681" font-weight="600">RECHERCHE DOCUMENTAIRE · RECONSTITUTION PÉDAGOGIQUE</text><rect x="42" y="224" width="1356" height="352" rx="16" fill="white" stroke="#d5dedf" stroke-width="2"/><text x="72" y="280" font-size="32" fill="#245f54" font-weight="600">Atmo Hauts-de-France · Actualités</text><text x="72" y="350" font-size="43" fill="#2156b6" font-weight="600">Bilans annuels de la qualité de l’air 2024</text><text x="72" y="407" font-size="29" fill="#65707b" font-weight="400">Publié le 2 juillet 2025</text><rect x="66" y="432" width="1215" height="106" rx="5" fill="#eef4fc"/><text x="80" y="474" font-size="37" fill="#17212b" font-weight="400">Les concentrations régionales diminuent depuis 2018.</text><text x="80" y="522" font-size="37" fill="#17212b" font-weight="400">Le bilan 2024 décrit les tendances dans les Hauts-de-France…</text><text x="62" y="633" font-size="26" fill="#2156b6" font-weight="700">EN OUVRANT LE DOCUMENT</text><rect x="42" y="661" width="1356" height="240" rx="12" fill="#edf5f1"/><text x="72" y="716" font-size="37" fill="#17212b" font-weight="400">Échelle : région. Période évoquée : 2018–2024.</text><text x="72" y="778" font-size="37" fill="#17212b" font-weight="400">La météo contribue aussi aux variations observées.</text><text x="72" y="840" font-size="37" fill="#17212b" font-weight="400">La question, elle, porte sur Lille entre 2015 et 2025.</text><text x="58" y="941" font-size="23" fill="#677783" font-weight="400">Source réelle ; extrait reformulé. L’ordre et l’interface sont fabriqués pour la démonstration.</text></g></svg>