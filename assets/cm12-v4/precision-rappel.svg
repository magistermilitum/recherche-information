<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>Deux proportions et deux dénominateurs : précision et rappel</title><rect width="1440" height="960" fill="#fbfcfd"/><g font-family="Arial,Helvetica,sans-serif"><text x="62" y="77" font-size="50" fill="#17212b" font-weight="700">Une recherche, deux questions</text><text x="62" y="126" font-size="30" fill="#54656d" font-weight="400">Exemple d’exercice : 6 documents pertinents dans un corpus de 12.</text><rect x="40" y="174" width="660" height="424" rx="16" fill="#f0f5ff"/><rect x="740" y="174" width="660" height="424" rx="16" fill="#eaf5f0"/><text x="72" y="235" font-size="31" fill="#2156b6" font-weight="700">PRÉCISION</text><text x="72" y="295" font-size="35" fill="#17212b" font-weight="400">Parmi ce que je retrouve…</text><text x="72" y="407" font-size="44" fill="#2156b6" font-weight="700">5 utiles / 8 retrouvés</text><text x="72" y="486" font-size="68" fill="#2156b6" font-weight="700">62,5 %</text><text x="72" y="558" font-size="32" fill="#9d3e35" font-weight="600">3 résultats hors cible = BRUIT</text><text x="772" y="235" font-size="31" fill="#146c50" font-weight="700">RAPPEL</text><text x="772" y="295" font-size="34" fill="#17212b" font-weight="400">Parmi ce qu’il fallait retrouver…</text><text x="772" y="407" font-size="44" fill="#146c50" font-weight="700">5 utiles / 6 pertinents</text><text x="772" y="486" font-size="68" fill="#146c50" font-weight="700">83,3 %</text><text x="772" y="558" font-size="31" fill="#785c9b" font-weight="600">1 pertinent manqué = SILENCE</text><rect x="40" y="646" width="1360" height="246" rx="16" fill="#f3f1f8"/><text x="72" y="704" font-size="39" fill="#574777" font-weight="700">Le dénominateur change la question</text><text x="72" y="763" font-size="36" fill="#17212b" font-weight="400">Le bruit se compte dans la liste retournée.</text><text x="72" y="821" font-size="36" fill="#17212b" font-weight="400">Le silence exige de connaître les documents pertinents absents.</text><text x="62" y="941" font-size="27" fill="#54656d" font-weight="400">Le compromis dépend du réglage : une meilleure reformulation peut améliorer les deux mesures.</text></g></svg>