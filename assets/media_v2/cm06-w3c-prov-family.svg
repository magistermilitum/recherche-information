<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture documentaire de la famille W3C PROV</title>
  <desc id="desc">Reconstruction vectorielle montrant un point d’entrée, les sérialisations et le socle formé par le modèle de données et les contraintes.</desc>
  <rect width="1600" height="760" fill="#f8f8f5"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17191e">
    <text x="80" y="72" font-size="26" font-weight="700" letter-spacing="4" fill="#505a5f">W3C PROV · FAMILLE DE SPÉCIFICATIONS</text>

    <g transform="translate(420 92)">
      <rect width="760" height="112" rx="10" fill="#d7f1f2" stroke="#116b70" stroke-width="4"/>
      <text x="380" y="70" text-anchor="middle" font-size="42" font-weight="700">PROV-PRIMER</text>
    </g>
    <line x1="800" y1="204" x2="800" y2="258" stroke="#505a5f" stroke-width="4"/>
    <text x="800" y="242" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="3" fill="#505a5f">SÉRIALISATIONS</text>

    <g transform="translate(120 270)">
      <rect width="380" height="142" rx="10" fill="#e7f4f3" stroke="#116b70" stroke-width="4"/>
      <text x="190" y="88" text-anchor="middle" font-size="42" font-weight="700">PROV-O</text>
      <text x="190" y="122" text-anchor="middle" font-size="22" fill="#505a5f">OWL 2 / RDF</text>
    </g>
    <g transform="translate(610 270)">
      <rect width="380" height="142" rx="10" fill="#eef0f7" stroke="#2457c5" stroke-width="4"/>
      <text x="190" y="88" text-anchor="middle" font-size="42" font-weight="700">PROV-XML</text>
      <text x="190" y="122" text-anchor="middle" font-size="22" fill="#505a5f">schéma XML</text>
    </g>
    <g transform="translate(1100 270)">
      <rect width="380" height="142" rx="10" fill="#f8e8e6" stroke="#b83b32" stroke-width="4"/>
      <text x="190" y="88" text-anchor="middle" font-size="42" font-weight="700">PROV-N</text>
      <text x="190" y="122" text-anchor="middle" font-size="22" fill="#505a5f">notation textuelle</text>
    </g>

    <line x1="310" y1="412" x2="310" y2="472" stroke="#116b70" stroke-width="4"/>
    <line x1="800" y1="412" x2="800" y2="472" stroke="#2457c5" stroke-width="4"/>
    <line x1="1290" y1="412" x2="1290" y2="472" stroke="#b83b32" stroke-width="4"/>
    <line x1="310" y1="452" x2="1290" y2="452" stroke="#505a5f" stroke-width="4"/>

    <g transform="translate(120 472)">
      <rect width="860" height="190" rx="10" fill="#f6dfdc" stroke="#b83b32" stroke-width="4"/>
      <text x="430" y="88" text-anchor="middle" font-size="46" font-weight="700">PROV-DM</text>
      <text x="430" y="134" text-anchor="middle" font-size="27" fill="#505a5f">entités · activités · agents · relations</text>
    </g>
    <g transform="translate(1020 472)">
      <rect width="460" height="190" rx="10" fill="#ffffff" stroke="#b83b32" stroke-width="5"/>
      <text x="230" y="82" text-anchor="middle" font-size="38" font-weight="700">PROV-</text>
      <text x="230" y="126" text-anchor="middle" font-size="38" font-weight="700">CONSTRAINTS</text>
      <text x="230" y="162" text-anchor="middle" font-size="23" fill="#505a5f">validité et inférences</text>
    </g>

    <text x="80" y="718" font-size="23" fill="#505a5f">Reconstruction originale d’après W3C PROV Overview.</text>
  </g>
</svg>
