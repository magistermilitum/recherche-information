<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Réglages de l’analyse de mise en page dans Transkribus</title>
  <desc id="desc">Reconstruction vectorielle d’un panneau Transkribus présentant la génération des régions, la méthode, l’orientation des lignes de base et l’échelle de l’image.</desc>
  <rect width="1600" height="900" fill="#eef1f4"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17233f">
    <rect x="120" y="48" width="1360" height="804" rx="24" fill="#ffffff" stroke="#c7cdd5" stroke-width="3"/>
    <text x="180" y="126" font-size="55" font-weight="700">Settings</text>
    <text x="1412" y="126" text-anchor="end" font-size="52">×</text>
    <line x1="180" y1="160" x2="1420" y2="160" stroke="#d7dbe0" stroke-width="3"/>

    <g transform="translate(180 195)">
      <text y="0" font-size="29" font-weight="700">Generation of Text Regions (Layout Blocks)</text>
      <rect y="28" width="770" height="78" rx="12" fill="#f5f6f7" stroke="#c7cdd5" stroke-width="2"/>
      <rect x="8" y="36" width="300" height="62" rx="8" fill="#193a73"/>
      <text x="158" y="77" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Generate new</text>
      <text x="520" y="77" text-anchor="middle" font-size="26" font-weight="700">Keep existing</text>
    </g>

    <g transform="translate(180 355)">
      <text y="0" font-size="29" font-weight="700">Text Region Method</text>
      <rect y="28" width="590" height="78" rx="12" fill="#f5f6f7" stroke="#c7cdd5" stroke-width="2"/>
      <rect x="8" y="36" width="248" height="62" rx="8" fill="#193a73"/>
      <text x="132" y="77" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">General</text>
      <text x="420" y="77" text-anchor="middle" font-size="26" font-weight="700">Custom</text>
    </g>

    <g transform="translate(180 515)">
      <text y="0" font-size="29" font-weight="700">Text Baseline Orientation</text>
      <rect y="28" width="650" height="78" rx="12" fill="#f5f6f7" stroke="#c7cdd5" stroke-width="2"/>
      <rect x="8" y="36" width="288" height="62" rx="8" fill="#193a73"/>
      <text x="152" y="77" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Horizontal</text>
      <text x="472" y="77" text-anchor="middle" font-size="26" font-weight="700">Mixed</text>
    </g>

    <g transform="translate(180 675)">
      <text y="0" font-size="29" font-weight="700">Image Scaling</text>
      <rect y="28" width="900" height="78" rx="12" fill="#f5f6f7" stroke="#c7cdd5" stroke-width="2"/>
      <rect x="8" y="36" width="248" height="62" rx="8" fill="#193a73"/>
      <text x="132" y="77" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Default</text>
      <text x="428" y="77" text-anchor="middle" font-size="26" font-weight="700">Upscale</text>
      <text x="712" y="77" text-anchor="middle" font-size="26" font-weight="700">Downscale</text>
    </g>

    <g transform="translate(1040 215)">
      <rect width="350" height="390" rx="18" fill="#edf3fb" stroke="#193a73" stroke-width="3"/>
      <text x="34" y="64" font-size="24" font-weight="700" letter-spacing="3" fill="#193a73">ORDRE DE CALCUL</text>
      <circle cx="62" cy="126" r="24" fill="#17664e"/><text x="62" y="135" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text>
      <text x="108" y="136" font-size="28">Régions</text>
      <line x1="62" y1="150" x2="62" y2="200" stroke="#8793a5" stroke-width="4"/>
      <circle cx="62" cy="224" r="24" fill="#8b5d0d"/><text x="62" y="233" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text>
      <text x="108" y="234" font-size="28">Lignes</text>
      <line x1="62" y1="248" x2="62" y2="298" stroke="#8793a5" stroke-width="4"/>
      <circle cx="62" cy="322" r="24" fill="#5649a8"/><text x="62" y="331" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text>
      <text x="108" y="332" font-size="28">Échelle</text>
    </g>
  </g>
</svg>
