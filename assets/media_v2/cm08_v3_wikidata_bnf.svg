<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Requête Wikidata sur la Bibliothèque nationale de France</title>
  <desc id="desc">La Bibliothèque nationale de France, identifiée par Q193563, est reliée à son type, son pays et son unité territoriale. Une courte requête SPARQL récupère ces relations et produit une table de trois lignes.</desc>
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#17303a" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#596d76"/></marker>
    <style>.edge{stroke-dasharray:12 9;animation:flow 3.5s linear infinite}@keyframes flow{to{stroke-dashoffset:-42}}@media(prefers-reduced-motion:reduce){.edge{animation:none}}</style>
  </defs>
  <rect width="1280" height="720" fill="#fafbf9"/>
  <rect x="54" y="42" width="9" height="86" rx="4" fill="#0b7775"/>
  <text x="84" y="76" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#0b7775">GRAPHE DE CONNAISSANCES · WIKIDATA</text>
  <text x="84" y="121" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#172127">Une question devient un motif de relations nommées</text>

  <g transform="translate(54 168)" font-family="Arial, sans-serif">
    <rect width="610" height="480" rx="24" fill="#eef5f4" stroke="#c7d7d7" stroke-width="2"/>
    <text x="26" y="42" font-size="18" font-weight="700" letter-spacing="2.5" fill="#0b7775">1 · LE GRAPHE</text>
    <g filter="url(#shadow)"><rect x="164" y="183" width="282" height="104" rx="26" fill="#172127"/><text x="305" y="224" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">Bibliothèque nationale</text><text x="305" y="255" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">de France · Q193563</text></g>
    <path class="edge" d="M194 183L112 112" fill="none" stroke="#315fc6" stroke-width="5" marker-end="url(#arrow)"/>
    <path class="edge" d="M305 183V100" fill="none" stroke="#c56d22" stroke-width="5" marker-end="url(#arrow)"/>
    <path class="edge" d="M416 183L500 112" fill="none" stroke="#0b7775" stroke-width="5" marker-end="url(#arrow)"/>
    <g filter="url(#shadow)">
      <rect x="24" y="60" width="176" height="76" rx="19" fill="#fff" stroke="#315fc6" stroke-width="3"/><text x="112" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#315fc6">P31 · instance de</text><text x="112" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#172127">bibliothèque nationale</text>
      <rect x="222" y="42" width="166" height="76" rx="19" fill="#fff" stroke="#c56d22" stroke-width="3"/><text x="305" y="73" text-anchor="middle" font-size="16" font-weight="700" fill="#b25e1c">P17 · pays</text><text x="305" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#172127">France · Q142</text>
      <rect x="410" y="60" width="176" height="76" rx="19" fill="#fff" stroke="#0b7775" stroke-width="3"/><text x="498" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#0b7775">P131 · située dans</text><text x="498" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#172127">Paris 13e · Q175129</text>
    </g>
    <g transform="translate(26 335)"><rect width="558" height="104" rx="18" fill="#fff" stroke="#bbcacd" stroke-width="2"/><text x="20" y="34" font-size="17" font-weight="700" letter-spacing="2" fill="#5a6c73">LECTURE</text><text x="20" y="67" font-size="21" font-weight="700" fill="#172127">Le nœud est stable ; les propriétés nomment</text><text x="20" y="94" font-size="21" font-weight="700" fill="#172127">exactement les liens que la requête parcourt.</text></g>
  </g>

  <g transform="translate(696 168)" font-family="Arial, sans-serif">
    <rect width="530" height="262" rx="24" fill="#172127"/>
    <text x="26" y="42" font-size="18" font-weight="700" letter-spacing="2.5" fill="#92d5cf">2 · LA REQUÊTE SPARQL</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#fff">
      <text x="28" y="83"><tspan fill="#9eb7ff">SELECT</tspan> ?propriété ?valeur ?libellé</text>
      <text x="28" y="116"><tspan fill="#9eb7ff">WHERE</tspan> {</text>
      <text x="48" y="149"><tspan fill="#e7bd6f">wd:Q193563</tspan> ?propriété ?valeur .</text>
      <text x="48" y="182"><tspan fill="#92d5cf">VALUES</tspan> ?propriété { wdt:P31</text>
      <text x="48" y="215">wdt:P17 wdt:P131 }</text>
      <text x="28" y="244">  SERVICE wikibase:label { … } }</text>
    </g>
  </g>

  <g transform="translate(696 448)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect width="530" height="200" rx="24" fill="#fff" stroke="#d5dcdf" stroke-width="2"/>
    <text x="26" y="40" font-size="18" font-weight="700" letter-spacing="2.5" fill="#315fc6">3 · LE RÉSULTAT</text>
    <g transform="translate(22 58)" font-size="16">
      <rect width="486" height="35" fill="#edf2fd"/><text x="14" y="23" font-weight="700" fill="#315fc6">propriété</text><text x="165" y="23" font-weight="700" fill="#315fc6">valeur</text><text x="315" y="23" font-weight="700" fill="#315fc6">libellé</text>
      <rect y="35" width="486" height="34" fill="#fff"/><text x="14" y="58" fill="#172127">P31</text><text x="165" y="58" fill="#172127">Q22806</text><text x="315" y="58" fill="#172127">bibliothèque nationale</text>
      <rect y="69" width="486" height="34" fill="#f5f7f7"/><text x="14" y="92" fill="#172127">P17</text><text x="165" y="92" fill="#172127">Q142</text><text x="315" y="92" fill="#172127">France</text>
      <rect y="103" width="486" height="34" fill="#fff"/><text x="14" y="126" fill="#172127">P131</text><text x="165" y="126" fill="#172127">Q175129</text><text x="315" y="126" fill="#172127">Paris 13e</text>
    </g>
  </g>
  <text x="56" y="688" font-family="Arial, sans-serif" font-size="15" fill="#607178">Infographie originale · données Wikidata sous CC0 · exemple vérifiable dans Wikidata Query Service</text>
</svg>
