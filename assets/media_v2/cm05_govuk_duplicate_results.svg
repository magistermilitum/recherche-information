<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Deux résultats GOV.UK issus d’un même objet documentaire</title>
  <desc id="desc">Reconstruction vectorielle d’une sortie d’indexation contenant deux entrées presque identiques pour l’enquête Cardtronics et DirectCash Payments.</desc>
  <rect width="1600" height="900" fill="#f7f7f5"/>
  <rect x="0" y="0" width="1600" height="24" fill="#1d70b8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17191e">
    <text x="92" y="92" font-size="28" font-weight="700" letter-spacing="4" fill="#505a5f">GOV.UK · SORTIE D’INDEXATION</text>
    <text x="92" y="176" font-size="64" font-weight="700">31 179 résultats trouvés</text>
    <line x1="92" y1="216" x2="1508" y2="216" stroke="#b1b4b6" stroke-width="3"/>

    <g transform="translate(92 262)">
      <rect width="1416" height="238" rx="8" fill="#ffffff" stroke="#b1b4b6" stroke-width="3"/>
      <rect width="14" height="238" rx="7" fill="#1d70b8"/>
      <text x="48" y="66" font-size="43" font-weight="700" fill="#1d70b8">Cardtronics / DirectCash Payments merger inquiry</text>
      <text x="48" y="112" font-size="25" font-weight="700" fill="#505a5f">13 June 2017 · CMA case · Competition and Markets Authority</text>
      <text x="48" y="164" font-size="31">The CMA is investigating the completed acquisition by Cardtronics</text>
      <text x="48" y="204" font-size="31">Holdings Limited of DirectCash Payments Inc.</text>
    </g>

    <g transform="translate(92 548)">
      <rect width="1416" height="238" rx="8" fill="#ffffff" stroke="#b1b4b6" stroke-width="3"/>
      <rect width="14" height="238" rx="7" fill="#d4351c"/>
      <text x="48" y="66" font-size="43" font-weight="700" fill="#1d70b8">Cardtronics / DirectCash Payments merger inquiry</text>
      <text x="48" y="112" font-size="25" font-weight="700" fill="#505a5f">CMA case · Competition and Markets Authority</text>
      <text x="48" y="164" font-size="31">The CMA is investigating the completed acquisition by Cardtronics</text>
      <text x="48" y="204" font-size="31">Holdings Limited of DirectCash Payments Inc.</text>
    </g>

    <text x="92" y="850" font-size="24" fill="#505a5f">Reconstruction pédagogique d’un doublon documenté dans l’index GOV.UK.</text>
  </g>
</svg>
