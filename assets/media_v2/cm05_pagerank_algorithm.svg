<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" role="img">
<title>PageRank: el algoritmo de autoridad de Brin y Page (1998) / PageRank: Brin and Page&#39;s authority algorithm (1998)</title>
<desc>Diagram of the PageRank algorithm formulated by Sergey Brin and Larry Page in 1998 (Computer Networks and ISDN Systems 30(1-7): 107-117, doi:10.1016/S0169-7552(98)00110-X). A node&#39;s authority is computed as PR(A) = (1-d) + d × sum of PR(T)/C(T) over all nodes T linking to A, with damping factor d=0.85. PageRank is equivalent to the stationary distribution of a random walker on the directed graph. Diagram by Carlos Eduardo Ravello Joo.</desc>


<rect width="1280" height="800" fill="#ffffff"></rect>

<text x="60" y="62" class="t-mono" font-size="11" letter-spacing="2" fill="#c0824a">FIG. · BRIN &amp; PAGE (1998)</text>
<line x1="60" y1="74" x2="1220" y2="74" stroke="#d4d6da" stroke-width="1"></line>
<text x="60" y="112" class="t-serif" font-size="26" fill="#1a1a1a">PageRank: el algoritmo de autoridad por propagación</text>
<text x="60" y="138" class="t-sans" font-size="13" fill="#6b7280">La autoridad de un nodo es una función de la autoridad de los nodos que apuntan a él</text>


<g id="pr-graph">
  
  <defs>
    <marker id="pr-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3d4248"></path>
    </marker>
  </defs>

  
  
  <line x1="290" y1="320" x2="420" y2="260" stroke="#3d4248" stroke-width="1.4" marker-end="url(#pr-arr)"></line>
  <line x1="290" y1="320" x2="420" y2="430" stroke="#3d4248" stroke-width="1.4" marker-end="url(#pr-arr)"></line>
  <line x1="460" y1="280" x2="465" y2="400" stroke="#3d4248" stroke-width="1.4" marker-end="url(#pr-arr)"></line>
  <line x1="445" y1="430" x2="320" y2="340" stroke="#3d4248" stroke-width="1.4" marker-end="url(#pr-arr)"></line>
  <line x1="230" y1="500" x2="430" y2="460" stroke="#3d4248" stroke-width="1.4" marker-end="url(#pr-arr)"></line>
  <line x1="230" y1="500" x2="430" y2="280" stroke="#3d4248" stroke-width="1.2" stroke-dasharray="0" marker-end="url(#pr-arr)"></line>
  <line x1="120" y1="380" x2="200" y2="490" stroke="#3d4248" stroke-width="1.2" marker-end="url(#pr-arr)"></line>
  <line x1="160" y1="220" x2="115" y2="350" stroke="#3d4248" stroke-width="1.2" marker-end="url(#pr-arr)"></line>
  <line x1="450" y1="240" x2="190" y2="220" stroke="#3d4248" stroke-width="1.2" marker-end="url(#pr-arr)"></line>

  
  
  <circle cx="470" cy="430" r="42" fill="#c0824a" stroke="#1a1a1a" stroke-width="1.5"></circle>
  <text x="470" y="436" class="t-serif" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="700">C</text>
  <text x="470" y="490" class="t-mono" font-size="11" text-anchor="middle" fill="#1a1a1a">PR ≈ 0,43</text>

  
  <circle cx="450" cy="240" r="32" fill="#fef6e3" stroke="#1a1a1a" stroke-width="1.4"></circle>
  <text x="450" y="246" class="t-serif" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="700">B</text>
  <text x="450" y="290" class="t-mono" font-size="10.5" text-anchor="middle" fill="#1a1a1a">PR ≈ 0,20</text>

  
  <circle cx="265" cy="320" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"></circle>
  <text x="265" y="326" class="t-serif" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">A</text>
  <text x="265" y="366" class="t-mono" font-size="10.5" text-anchor="middle" fill="#1a1a1a">PR ≈ 0,11</text>

  
  <circle cx="215" cy="510" r="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"></circle>
  <text x="215" y="516" class="t-serif" font-size="16" text-anchor="middle" fill="#1a1a1a" font-weight="700">D</text>
  <text x="215" y="554" class="t-mono" font-size="10.5" text-anchor="middle" fill="#1a1a1a">PR ≈ 0,09</text>

  
  <circle cx="105" cy="380" r="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"></circle>
  <text x="105" y="385" class="t-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="700">E</text>
  <text x="105" y="420" class="t-mono" font-size="10.5" text-anchor="middle" fill="#1a1a1a">PR ≈ 0,06</text>

  
  <circle cx="170" cy="190" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"></circle>
  <text x="170" y="195" class="t-serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">F</text>
  <text x="170" y="160" class="t-mono" font-size="10.5" text-anchor="middle" fill="#1a1a1a">PR ≈ 0,04</text>
</g>

<text x="60" y="610" class="t-mono" font-size="10.5" letter-spacing="1.6" fill="#2c3e50">RED DIRIGIDA DE 6 NODOS · ESTADO ESTACIONARIO TRAS ITERACIÓN</text>
<text x="60" y="630" class="t-sans" font-size="11" fill="#6b7280" font-style="italic">El tamaño de cada nodo es proporcional a su valor PageRank. Suma total = 1.</text>


<g transform="translate(660,160)">
  <rect x="0" y="0" width="540" height="160" fill="#fef6e3" stroke="#c0824a" stroke-width="1.4"></rect>
  <text x="24" y="32" class="t-mono" font-size="10.5" letter-spacing="1.6" fill="#c0824a">FÓRMULA DEL ALGORITMO</text>
  <text x="270" y="78" class="t-serif" font-size="22" text-anchor="middle" fill="#1a1a1a">
    PR(A) = (1 − d) + d · Σ <tspan font-style="italic">PR(T)/C(T)</tspan>
  </text>
  <text x="270" y="112" class="t-sans" font-size="12" text-anchor="middle" fill="#3d4248">
    donde T son los nodos que apuntan a A
  </text>
  <text x="270" y="130" class="t-sans" font-size="12" text-anchor="middle" fill="#3d4248">
    y C(T) es el número de enlaces salientes de cada T
  </text>
  <text x="270" y="148" class="t-mono" font-size="11" text-anchor="middle" fill="#6b7280">
    factor de amortiguación d = 0,85
  </text>
</g>

<g transform="translate(660,350)">
  <text x="0" y="0" class="t-mono" font-size="10.5" letter-spacing="1.6" fill="#2c3e50">INTERPRETACIÓN</text>
  <line x1="0" y1="10" x2="540" y2="10" stroke="#1a1a1a" stroke-width="0.8"></line>
  <text x="0" y="40" class="t-serif" font-size="14" fill="#1a1a1a" font-style="italic">«Un enlace de una página A a una página B</text>
  <text x="0" y="60" class="t-serif" font-size="14" fill="#1a1a1a" font-style="italic">puede ser considerado como un voto, de A,</text>
  <text x="0" y="80" class="t-serif" font-size="14" fill="#1a1a1a" font-style="italic">para B. Pero PageRank va más allá del</text>
  <text x="0" y="100" class="t-serif" font-size="14" fill="#1a1a1a" font-style="italic">simple conteo de votos: los votos provenientes</text>
  <text x="0" y="120" class="t-serif" font-size="14" fill="#1a1a1a" font-style="italic">de páginas que son a su vez &#39;importantes&#39;</text>
  <text x="0" y="140" class="t-serif" font-size="14" fill="#1a1a1a" font-style="italic">pesan más fuertemente.»</text>
  <text x="0" y="170" class="t-sans" font-size="11" fill="#6b7280">— Brin &amp; Page (1998), §2.1</text>
</g>

<g transform="translate(660,560)">
  <rect x="0" y="0" width="540" height="80" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"></rect>
  <text x="270" y="32" class="t-mono" font-size="10.5" letter-spacing="1.6" text-anchor="middle" fill="#2c3e50">INTERPRETACIÓN PROBABILÍSTICA</text>
  <text x="270" y="56" class="t-serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">PageRank es la distribución estacionaria</text>
  <text x="270" y="72" class="t-serif" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">de un caminante aleatorio sobre la red.</text>
</g>

<line x1="60" y1="730" x2="1220" y2="730" stroke="#ececee" stroke-width="1"></line>
<text x="60" y="752" class="t-mono" font-size="10" fill="#6b7280">Adaptado de Brin, S. &amp; Page, L. (1998). The anatomy of a large-scale hypertextual web search engine. Computer Networks and ISDN Systems, 30(1–7), 107–117. doi:10.1016/S0169-7552(98)00110-X</text>
<text x="60" y="770" class="t-mono" font-size="9.5" fill="#9ca3af">Diagram by Carlos Eduardo Ravello Joo · ORCID 0009-0007-5631-7436 · Wikidata Q139714842 · carlosravello.com · CC BY-SA 4.0</text>

</svg>