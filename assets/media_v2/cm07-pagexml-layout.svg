<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Du pixel à la structure PAGE XML</title>
  <desc id="desc">Une page numérique est segmentée en régions, lignes de base et ordre de lecture, puis traduite en arborescence XML.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#4e6871"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#102026" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#f7f8f5"/>
  <rect x="64" y="52" width="12" height="94" rx="6" fill="#7752a2"/>
  <text x="102" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#7752a2">PAGE XML</text>
  <text x="102" y="137" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#162026">La géométrie devient une structure interrogeable</text>

  <g transform="translate(92 198)" filter="url(#shadow)">
    <rect width="585" height="610" rx="24" fill="#fff" stroke="#bdc9cc" stroke-width="3"/>
    <rect x="65" y="48" width="455" height="500" rx="8" fill="#eef2ef" stroke="#2c454e" stroke-width="4"/>
    <rect x="92" y="82" width="182" height="48" rx="6" fill="#f0c46a" opacity=".7" stroke="#a66b13" stroke-width="3"/>
    <text x="112" y="113" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#70480c">R1 · TITRE</text>
    <rect x="92" y="158" width="376" height="164" rx="6" fill="#77c3c0" opacity=".28" stroke="#107a80" stroke-width="3"/>
    <text x="112" y="188" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0d6064">R2 · CORPS</text>
    <g stroke="#16777c" stroke-width="4" stroke-linecap="round">
      <path d="M116 224C190 218 282 228 440 220"/>
      <path d="M116 260C208 254 320 265 440 255"/>
      <path d="M116 296C216 290 332 300 440 292"/>
    </g>
    <rect x="92" y="348" width="224" height="151" rx="6" fill="#cf776d" opacity=".22" stroke="#bc473c" stroke-width="3"/>
    <text x="112" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8e3028">R3 · TABLEAU</text>
    <path d="M112 405H296M112 439H296M171 389V481M235 389V481" stroke="#bc473c" stroke-width="3" opacity=".8"/>
    <rect x="342" y="348" width="126" height="151" rx="6" fill="#8fa8d6" opacity=".3" stroke="#486ba7" stroke-width="3"/>
    <circle cx="405" cy="405" r="26" fill="#486ba7" opacity=".55"/><path d="M363 475L392 435L417 458L448 413V475Z" fill="#486ba7" opacity=".55"/>
    <text x="112" y="588" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#344c55">PIXELS + COORDONNÉES</text>
  </g>

  <path d="M710 495H846" stroke="#4e6871" stroke-width="6" marker-end="url(#arrow)"/>
  <g transform="translate(733 420)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="46" cy="46" r="46" fill="#162026"/>
    <text x="46" y="38" font-size="15" font-weight="700" fill="#c6d3d6">ORDRE</text><text x="46" y="62" font-size="19" font-weight="700" fill="#fff">1 → 2 → 3</text>
  </g>

  <g transform="translate(884 198)" font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect width="624" height="610" rx="24" fill="#132329"/>
    <text x="42" y="62" font-size="20" font-weight="700" letter-spacing="2" fill="#9fb2b8">ARBORESCENCE</text>
    <g transform="translate(42 66)" font-family="monospace" font-size="23">
      <text y="0" fill="#96d5d2">&lt;PcGts&gt;</text>
      <text x="32" y="46" fill="#ccd7da">&lt;Page imageWidth="2400" imageHeight="3600"&gt;</text>
      <text x="64" y="98" fill="#f0c46a">&lt;TextRegion id="r1" type="heading"&gt;</text>
      <text x="96" y="140" fill="#ccd7da">&lt;Coords points="…" /&gt;</text>
      <text x="64" y="182" fill="#f0c46a">&lt;/TextRegion&gt;</text>
      <text x="64" y="234" fill="#69c0bd">&lt;TextRegion id="r2" type="paragraph"&gt;</text>
      <text x="96" y="276" fill="#ccd7da">&lt;TextLine id="l1"&gt;</text>
      <text x="128" y="318" fill="#9db7e4">&lt;Baseline points="…" /&gt;</text>
      <text x="128" y="360" fill="#ccd7da">&lt;Unicode&gt;…&lt;/Unicode&gt;</text>
      <text x="96" y="402" fill="#ccd7da">&lt;/TextLine&gt;</text>
      <text x="64" y="444" fill="#69c0bd">&lt;/TextRegion&gt;</text>
      <text x="32" y="490" fill="#ccd7da">&lt;/Page&gt;</text>
      <text y="536" fill="#96d5d2">&lt;/PcGts&gt;</text>
    </g>
  </g>
  <text x="92" y="857" font-family="Arial, sans-serif" font-size="18" fill="#596d74">Reconstruction originale d’après PAGE XML · github.com/PRImA-Research-Lab/PAGE-XML · licence Apache 2.0</text>
</svg>
