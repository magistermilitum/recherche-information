<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Similarité cosinus expliquée par trois angles</title>
  <desc id="desc">Un vecteur de requête est comparé à trois vecteurs candidats séparés de quinze, quarante-cinq et quatre-vingt-dix degrés. Les similarités cosinus correspondantes sont 0,97, 0,71 et 0.</desc>
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17303a" flood-opacity=".12"/></filter>
    <marker id="arrowQ" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#202a30"/></marker>
    <marker id="arrowA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0b7775"/></marker>
    <marker id="arrowB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315fc6"/></marker>
    <marker id="arrowC" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c04439"/></marker>
    <style>.ray{stroke-dasharray:700;stroke-dashoffset:0;animation:draw 1.5s ease-out forwards}.b{animation-delay:.25s}.c{animation-delay:.5s}@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.ray{animation:none;stroke-dashoffset:0}}</style>
  </defs>
  <rect width="1280" height="720" fill="#fafbf9"/>
  <rect x="54" y="42" width="9" height="86" rx="4" fill="#0b7775"/>
  <text x="84" y="76" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#0b7775">SIMILARITÉ COSINUS</text>
  <text x="84" y="121" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#172127">L’angle classe les directions, pas la longueur</text>

  <g transform="translate(55 165)">
    <rect width="710" height="485" rx="24" fill="#f2f6f7" stroke="#cbd7dc" stroke-width="2"/>
    <g opacity=".55" stroke="#c3cfd4" stroke-width="2"><path d="M125 414H660"/><path d="M125 414V38"/><circle cx="125" cy="414" r="100" fill="none" stroke-dasharray="5 9"/><circle cx="125" cy="414" r="205" fill="none" stroke-dasharray="5 9"/><circle cx="125" cy="414" r="320" fill="none" stroke-dasharray="5 9"/></g>
    <path class="ray" d="M125 414H625" fill="none" stroke="#202a30" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowQ)"/>
    <path class="ray" d="M125 414L560 298" fill="none" stroke="#0b7775" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowA)"/>
    <path class="ray b" d="M125 414L422 117" fill="none" stroke="#315fc6" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowB)"/>
    <path class="ray c" d="M125 414V144" fill="none" stroke="#c04439" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowC)"/>
    <path d="M235 414A110 110 0 0 0 231 386" fill="none" stroke="#0b7775" stroke-width="5"/>
    <path d="M275 414A150 150 0 0 0 231 308" fill="none" stroke="#315fc6" stroke-width="5"/>
    <path d="M315 414A190 190 0 0 0 125 224" fill="none" stroke="#c04439" stroke-width="5"/>
    <g font-family="Arial, sans-serif" font-weight="700">
      <text x="655" y="422" font-size="22" text-anchor="end" fill="#202a30">requête q</text>
      <text x="550" y="278" font-size="22" text-anchor="end" fill="#0b7775">candidat A · 15°</text>
      <text x="409" y="93" font-size="22" text-anchor="end" fill="#315fc6">candidat B · 45°</text>
      <text x="145" y="136" font-size="22" fill="#c04439">candidat C · 90°</text>
      <text x="241" y="381" font-size="18" fill="#0b7775">15°</text><text x="232" y="294" font-size="18" fill="#315fc6">45°</text><text x="204" y="238" font-size="18" fill="#c04439">90°</text>
    </g>
    <circle cx="125" cy="414" r="10" fill="#172127"/>
  </g>

  <g transform="translate(800 165)" font-family="Arial, sans-serif">
    <rect width="425" height="485" rx="24" fill="#fff" stroke="#d5dcdf" stroke-width="2" filter="url(#shadow)"/>
    <text x="28" y="48" font-size="18" font-weight="700" letter-spacing="2.5" fill="#5b6c73">CLASSEMENT PAR ANGLE</text>
    <g transform="translate(28 72)"><rect width="369" height="82" rx="18" fill="#e9f5f3" stroke="#0b7775" stroke-width="2"/><circle cx="42" cy="41" r="23" fill="#0b7775"/><text x="42" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">A</text><text x="82" y="35" font-size="19" fill="#4f6168">cos 15°</text><text x="82" y="65" font-size="29" font-weight="700" fill="#172127">0,97 · très proche</text></g>
    <g transform="translate(28 166)"><rect width="369" height="82" rx="18" fill="#edf2fd" stroke="#315fc6" stroke-width="2"/><circle cx="42" cy="41" r="23" fill="#315fc6"/><text x="42" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">B</text><text x="82" y="35" font-size="19" fill="#4f6168">cos 45°</text><text x="82" y="65" font-size="29" font-weight="700" fill="#172127">0,71 · voisin</text></g>
    <g transform="translate(28 260)"><rect width="369" height="82" rx="18" fill="#faecea" stroke="#c04439" stroke-width="2"/><circle cx="42" cy="41" r="23" fill="#c04439"/><text x="42" y="49" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">C</text><text x="82" y="35" font-size="19" fill="#4f6168">cos 90°</text><text x="82" y="65" font-size="29" font-weight="700" fill="#172127">0,00 · orthogonal</text></g>
    <rect x="28" y="365" width="369" height="88" rx="18" fill="#f4f1e8" stroke="#c9b67a" stroke-width="2"/>
    <text x="48" y="398" font-size="19" font-weight="700" fill="#172127">cos(q,d) = (q · d) / [√(q·q) × √(d·d)]</text>
    <text x="48" y="426" font-size="16" fill="#53656d">La longueur est neutralisée ;</text>
    <text x="48" y="447" font-size="16" fill="#53656d">pertinence et vérité restent à vérifier.</text>
  </g>
  <text x="56" y="688" font-family="Arial, sans-serif" font-size="15" fill="#607178">Infographie originale · formule d’après Google ML et scikit-learn · angles arrondis pour la lecture</text>
</svg>
